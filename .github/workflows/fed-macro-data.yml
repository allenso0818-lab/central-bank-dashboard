name: Refresh Fed Macro Data
on:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * *"
  push:
    paths:
      - ".github/workflows/fed-macro-data.yml"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build resilient macro cache
        run: |
          python - <<'PY'
          import json, urllib.request, pathlib, time
          ids=["UNEMPLOY","CLF16OV","UNRATE","CNP16OV","CE16OV","U4RATE","CIVPART","PAYEMS","CES0500000003","AWHAETP","ICSA","GDPC1","A191RL1Q225SBEA"]
          bls={"UNEMPLOY":"LNS13000000","CLF16OV":"LNS11000000","UNRATE":"LNS14000000","CNP16OV":"LNS10000000","CE16OV":"LNS12000000","U4RATE":"LNS13327708","CIVPART":"LNS11300000","PAYEMS":"CES0000000001","CES0500000003":"CES0500000003","AWHAETP":"CES0500000002"}
          p=pathlib.Path("data/fed-macro.json")
          try: old=json.loads(p.read_text())
          except: old={"series":{}}
          out={"updated_at":time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime()),"source":"Official BLS public API where available; cached last-known-good values retained on refresh failure","series":dict(old.get("series",{}))}
          for sid in ids:
            vals=[]
            if sid in bls:
              try:
                body=json.dumps({"seriesid":[bls[sid]],"startyear":"2006","endyear":"2026"}).encode()
                req=urllib.request.Request("https://api.bls.gov/publicAPI/v2/timeseries/data/",data=body,headers={"Content-Type":"application/json","User-Agent":"central-bank-dashboard/1.0"})
                with urllib.request.urlopen(req,timeout=15) as r: doc=json.loads(r.read().decode())
                months={f"M{i:02d}":f"{i:02d}" for i in range(1,13)}
                for row in doc["Results"]["series"][0]["data"]:
                  if row.get("period") in months:
                    vals.append([f'{row["year"]}-{months[row["period"]]}-01',float(row["value"].replace(",",""))])
                vals.sort()
              except Exception as e: print("WARN",sid,e)
            if vals: out["series"][sid]=vals
            else: out["series"].setdefault(sid,[])
          p.parent.mkdir(exist_ok=True)
          p.write_text(json.dumps(out,separators=(",",":")))
          PY
      - name: Commit cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fed-macro.json
          git diff --cached --quiet || (git commit -m "Refresh Fed macro cache" && git push)
