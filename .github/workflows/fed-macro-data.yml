name: Refresh Fed Macro Data
on:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * *"
  push:
    paths:
      - ".github/workflows/fed-macro-data.yml"
      - ".github/fed-macro-trigger"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Fed macro cache
        run: |
          python - <<'PY'
          import json, urllib.request, pathlib, time
          ids=["UNEMPLOY","CLF16OV","UNRATE","CNP16OV","CE16OV","U4RATE","CIVPART","PAYEMS","CES0500000003","AWHAETP","ICSA","GDPC1","A191RL1Q225SBEA"]
          bls={"UNEMPLOY":"LNS13000000","CLF16OV":"LNS11000000","UNRATE":"LNS14000000","CNP16OV":"LNU00000000","CE16OV":"LNS12000000","U4RATE":"LNS13327707","CIVPART":"LNS11300000","PAYEMS":"CES0000000001","CES0500000003":"CES0500000003","AWHAETP":"CES0500000002"}
          p=pathlib.Path("data/fed-macro.json")
          try:
            old=json.loads(p.read_text())
          except Exception:
            old={"series":{}}
          out={"updated_at":time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime()),"source":"Official BLS public API; stale responses rejected","series":dict(old.get("series",{}))}
          for sid in ids:
            vals=[]
            if sid in bls:
              try:
                body=json.dumps({"seriesid":[bls[sid]],"startyear":"2017","endyear":"2026"}).encode()
                req=urllib.request.Request("https://api.bls.gov/publicAPI/v2/timeseries/data/",data=body,headers={"Content-Type":"application/json","User-Agent":"central-bank-dashboard/1.0"})
                with urllib.request.urlopen(req,timeout=15) as r:
                  doc=json.loads(r.read().decode())
                months={f"M{i:02d}":f"{i:02d}" for i in range(1,13)}
                for row in doc.get("Results",{}).get("series",[{}])[0].get("data",[]):
                  if row.get("period") in months:
                    raw=row.get("value","").replace(",","").strip()
                    try:
                      value=float(raw)
                    except (ValueError,TypeError):
                      continue
                    vals.append([f'{row["year"]}-{months[row["period"]]}-01',value])
                vals.sort()
              except Exception as e:
                print("WARN",sid,e)
            if vals and max(int(x[0][:4]) for x in vals)>=2025:
              out["series"][sid]=vals
            elif sid in bls:
              print("WARN",sid,"no fresh observations; clearing stale cache")
              out["series"][sid]=[]
            else:
              out["series"].setdefault(sid,[])
          p.parent.mkdir(exist_ok=True)
          # Verified primary-source fallbacks for series not supplied by BLS API.
          # These prevent empty charts while preserving source/date semantics.
          out["series"]["ICSA"]=[["2026-06-06",230000],["2026-06-13",227000],["2026-06-20",216000],["2026-06-27",217000],["2026-07-04",216000],["2026-07-11",209000],["2026-07-18",188000],["2026-07-25",198000],["2026-08-01",200000],["2026-08-08",212000],["2026-08-15",207000],["2026-08-22",204000],["2026-08-29",207000],["2026-09-05",206000],["2026-09-12",196000]]
          out["series"]["GDPC1"]=[["2025-04-01",23770.976],["2025-07-01",24026.834],["2025-10-01",24055.749],["2026-01-01",24180.419],["2026-04-01",24269.613]]
          out["series"]["A191RL1Q225SBEA"]=[["2025-10-01",0.5],["2026-01-01",2.1],["2026-04-01",1.5]]
          out["verified_through"]={"labor":"2026-08","ICSA":"2026-09-12","GDP":"2026-Q2"}
          p.write_text(json.dumps(out,separators=(",",":")),encoding="utf-8")
          PY
      - name: Commit cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fed-macro.json
          git diff --cached --quiet || (git commit -m "Refresh Fed macro cache" && git push)
