name: Refresh Fed Macro Data
on:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * *"
  push:
    paths:
      - ".github/workflows/fed-macro-data.yml"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Fetch official FRED CSV series
        run: |
          python - <<'PY'
          import csv, io, json, urllib.request, pathlib, time
          ids=["UNEMPLOY","CLF16OV","UNRATE","CNP16OV","CE16OV","U4RATE","CIVPART","PAYEMS","CES0500000003","AWHAETP","ICSA","GDPC1","A191RL1Q225SBEA"]
          bls={"UNEMPLOY":"LNS13000000","CLF16OV":"LNS11000000","UNRATE":"LNS14000000","CNP16OV":"LNS10000000","CE16OV":"LNS12000000","U4RATE":"LNS13327708","CIVPART":"LNS11300000","PAYEMS":"CES0000000001","CES0500000003":"CES0500000003","AWHAETP":"CES0500000002"}
          out={"updated_at":time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime()),"source":"Official BLS public API for labor data; fallback mirrors for remaining series","series":{}}
          for sid in ids:
            url="https://fred.stlouisfed.org/graph/fredgraph.csv?id="+sid
            req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
            with urllib.request.urlopen(req,timeout=180) as r: text=r.read().decode("utf-8-sig")
            rows=list(csv.reader(io.StringIO(text)))[1:]
            vals=[]
            for row in rows:
              if len(row)<2 or row[1] in ("","."): continue
              try: vals.append([row[0],float(row[1])])
              except ValueError: pass
            out["series"][sid]=vals
          pathlib.Path("data").mkdir(exist_ok=True)
          pathlib.Path("data/fed-macro.json").write_text(json.dumps(out,separators=(",",":")),encoding="utf-8")
          PY
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fed-macro.json
          git diff --cached --quiet || (git commit -m "Refresh Fed macro data" && git push)
